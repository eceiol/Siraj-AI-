  isolation: isolate;

main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.top-logos {
  position: relative;
  z-index: 20;
  width: 100%;
  background: #051a25;
  border-bottom: 1px solid rgba(214,168,98,.28);
}

.top-logos img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 150px;
  object-fit: cover;
  object-position: center;
}

.screen {
  flex: 1;
  position: relative;
}

.home-screen {
  display: grid;
  place-items: center;
  padding: 28px 18px 70px;
}

.home-content {
  width: min(760px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.hero-robot {
  width: min(340px, 70vw);
  max-height: 410px;
  object-fit: contain;
  filter: drop-shadow(0 20px 30px rgba(0,0,0,.35));
  margin-bottom: -10px;
}

.chat-bubble {
  position: relative;
  background: rgba(255,255,255,.96);
  color: var(--ink);
  border-radius: 24px;
  box-shadow: 0 18px 45px rgba(0,0,0,.28);
}

.hero-bubble {
  width: min(420px, 92%);
  padding: 20px 28px;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero-bubble::after {
  content: "";
  position: absolute;
  bottom: -15px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 16px 16px 0;
  border-style: solid;
  border-color: rgba(255,255,255,.96) transparent transparent;
}

.bot-dot {
  color: #2fbd76;
  font-size: 20px;
  line-height: 1;
}

.hero-bubble h1 {
  margin: 0;
  font-size: clamp(25px, 5vw, 38px);
  color: var(--green);
}

.hero-bubble p {
  margin: 0;
  font-size: clamp(15px, 2.6vw, 19px);
  line-height: 1.8;
}

.primary-btn {
  margin-top: 38px;
  border: 0;
  border-radius: 999px;
  padding: 15px 28px;
  min-width: 245px;
  background: linear-gradient(135deg, #d9a85c, #b8823a);
  color: #1a1206;
  font: inherit;
  font-weight: 700;
  font-size: 17px;
  cursor: pointer;
  box-shadow: 0 12px 30px rgba(0,0,0,.3);
  transition: transform .2s, filter .2s;
}

.primary-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
.primary-btn:active { transform: translateY(0); }

.chat-screen {
  padding: 30px 16px 70px;
}

.chat-shell {
  width: min(920px, 100%);
  margin: 0 auto;
  background: rgba(4, 24, 40, .78);
  border: 1px solid rgba(217,168,92,.28);
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 25px 70px rgba(0,0,0,.35);
  backdrop-filter: blur(10px);
}

.chat-header {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px 18px;
  background: rgba(0,0,0,.32);
  border-bottom: 1px solid rgba(255,255,255,.10);
}

.chat-header strong { display: block; font-size: 18px; }
.chat-header small { display: block; opacity: .72; margin-top: 2px; }

.bot-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #effff5;
  overflow: hidden;
  flex: 0 0 auto;
}
.bot-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 28%;
}

.back-btn {
  margin-right: auto;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.18);
  color: white;
  background: rgba(255,255,255,.08);
  cursor: pointer;
  font-size: 20px;
}

.intro-message {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 25px 20px 12px;
}

.mini-avatar {
  width: 42px;
  height: 42px;
  overflow: hidden;
  border-radius: 50%;
  background: white;
  flex: 0 0 auto;
}
.mini-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 25%;
}

.message {
  max-width: 85%;
  padding: 13px 17px;
  border-radius: 18px 18px 18px 4px;
  line-height: 1.9;
}

.bot-message {
  background: rgba(240,246,252,.97);
  color: #12283a;
}

.questions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 12px 20px 20px;
}

.question-card {
  width: 100%;
  border: 1px solid rgba(217,168,92,.28);
  border-radius: 18px;
  background: rgba(14, 52, 78, .70);
  color: white;
  padding: 15px 17px;
  text-align: right;
  font: inherit;
  line-height: 1.75;
  cursor: pointer;
  transition: background .2s, transform .2s, border-color .2s;
}

.question-card:hover {
  background: rgba(30, 78, 112, .90);
  border-color: rgba(217,168,92,.70);
  transform: translateY(-1px);
}

.question-card .q-icon {
  display: inline-flex;
  width: 28px;
  height: 28px;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,.12);
  margin-left: 8px;
}

.answer-wrap {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-top: -2px;
  margin-bottom: 5px;
}

.answer-wrap .mini-avatar {
  width: 36px;
  height: 36px;
  margin-top: 4px;
}

.answer {
  flex: 1;
  background: rgba(244,248,253,.98);
  color: #12283a;
  border-radius: 4px 18px 18px 18px;
  padding: 15px 17px;
  line-height: 1.95;
  box-shadow: 0 7px 20px rgba(0,0,0,.14);
  animation: appear .28s ease;
}

.answer strong { color: #0a2a40; }
.answer a {
  color: #9a6a24;
  font-weight: 700;
  text-decoration: none;
}
.answer a:hover { text-decoration: underline; }

.source {
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px solid rgba(10,42,64,.14);
  font-size: 12px;
  opacity: .78;
}

.source-note {
  text-align: center;
  font-size: 12px;
  opacity: .6;
  padding: 3px 20px 22px;
}

.hidden { display: none !important; }

@keyframes appear {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 650px) {
  .top-logos img { max-height: 105px; object-fit: cover; }
  .home-screen { padding-top: 22px; }
  .hero-robot { width: min(285px, 72vw); max-height: 340px; }
  .hero-bubble { padding: 18px 18px; border-radius: 20px; }
  .chat-screen { padding: 15px 10px 45px; }
  .chat-shell { border-radius: 20px; }
  .questions { padding: 10px 12px 15px; }
  .intro-message { padding: 18px 12px 10px; }
  .message { max-width: 88%; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
}

@media (max-height: 760px) and (min-width: 651px) {
  .hero-robot { width: min(260px, 40vh); }
  .primary-btn { margin-top: 28px; }
}

@media (min-width: 1100px) {
  .chat-shell { width: min(980px, 100%); }
}

</style>
</head>
