<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#051a25">
  <title>Siraj</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-logos">
    <img src="assets/header-pattern.png" alt="" role="presentation">
  </header>

  <main>
    <section id="home" class="screen home-screen">
      <div class="home-content">
        <img class="robot hero-robot" src="assets/robot.png" alt="الروبوت المساعد">
        <div class="chat-bubble hero-bubble">
          <span class="bot-dot">●</span>
          <div>
            <h1>Siraj</h1>
            
          </div>
        </div>
        <button id="startBtn" class="primary-btn">انقر هنا لبدء المحادثة <span>←</span></button>
      </div>
    </section>

    <section id="chat" class="screen chat-screen hidden">
      <div class="chat-shell">
        <div class="chat-header">
          <div class="bot-avatar"><img src="assets/robot.png" alt=""></div>
          <div>
            <strong>Siraj</strong>
            <small>مساعدك الذكي للتعرّف على القيم الإسلامية، وفهم مبادئها وأثرها في بناء الفرد والمجتمع.</small>
          </div>
          <button id="backBtn" class="back-btn" aria-label="العودة">↩</button>
        </div>

        <div class="intro-message">
          <div class="mini-avatar"><img src="assets/robot.png" alt=""></div>
          <div class="message bot-message">
            أهلًا بك! هنا تبدأ رحلتك نحو فهم القيم والأخلاق الإسلامية
          </div>
        </div>

        <div id="questions" class="questions"></div>
        <div class="source-note">عمل الطالبات: ريتاج سعيد، لمار وليد، وفاء سعد، جوري ابراهيم، غلا راجح</div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
